version: '3.8'

services:
  # Backend API Server (FastAPI + SQLite/Postgres)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pantrypal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/pantrypal.db
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173
      - SESSION_SECRET_KEY=change_this_to_a_random_32_character_secret_key!
      - SESSION_MAX_AGE_DAYS=14
    volumes:
      - pantrypal_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend Web Client (React + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pantrypal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Persistent volume for SQLite database storage across container restarts
  pantrypal_data:
    driver: local
